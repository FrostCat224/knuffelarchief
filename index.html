<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Knuffelarchief</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #87d5ed;
            min-height: 100vh;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: white;
            margin-top: 0;
        }

        #plushies {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: auto;
        }

        .plushie {
            background: white;
            overflow: hidden;
            text-align: center;
            padding-bottom: 15px;
        }

        .plushie img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            background: #eee;
        }

        .plushie h2 {
            font-size: 18px;
            margin: 12px 10px 8px;
        }

        .plushie a {
            display: inline-block;
            background: white;
            color: black;
            text-decoration: none;
            padding: 8px 14px;
        }

    </style>
</head>

<body>

    <h1>Knuffelarchief</h1>

    <div id="plushies"></div>

    <script>
        const plushiesContainer = document.getElementById("plushies");

        fetch("plushies.json")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Could not load plushies.json");
                }

                return response.json();
            })
            .then(plushies => {

                plushies.forEach(plushie => {

                    const div = document.createElement("div");
                    div.className = "plushie";

                    div.innerHTML = `
                        <img src="${plushie.image}" alt="${plushie.name}">
                        <a href="${plushie.link}" target="_blank">
                            ${plushie.name}
                        </a>
                    `;

                    plushiesContainer.appendChild(div);
                });

            })
            .catch(error => {
                console.error(error);

                plushiesContainer.innerHTML =
                    "<p>Error</p>";
            });
    </script>

</body>
</html>
